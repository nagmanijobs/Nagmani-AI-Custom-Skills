name: Sync Skills To Repositories

on:
  push:
    branches: [main]
    paths:
      - '.github/skills/**'
      - '.github/scripts/sync-skills-to-repos.sh'
      - '.github/workflows/sync-skills.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      target_repos_csv:
        description: 'Optional allowlist of repos (comma-separated owner/repo). Example: nagmanijobs/Github_Action_Certification,nagmanijobs/another-repo'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI auth
        run: |
          gh auth status
        env:
          GH_TOKEN: ${{ secrets.SKILL_SYNC_TOKEN }}

      - name: Sync skills to repositories
        run: .github/scripts/sync-skills-to-repos.sh
        env:
          GH_TOKEN: ${{ secrets.SKILL_SYNC_TOKEN }}
          TARGET_OWNER: nagmanijobs
          TARGET_OWNER_TYPE: user
          TARGET_REPOS_CSV: ${{ github.event.inputs.target_repos_csv }}
          SKIP_REPOS_CSV: nagmanijobs/Nagmani-AI-Custom-Skills